# Generated by HyperThemes.
# Source this from ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/hyperthemes.conf
# HyperThemes keeps the rest of your Hyprland configuration untouched.

$hyper_active = rgba({{primary}}ee)
$hyper_active_alt = rgba({{secondary}}ee)
$hyper_inactive = rgba({{outline}}ee)
$hyper_urgent = rgba({{error}}ee)

general {
    col.active_border = $hyper_active $hyper_active_alt 45deg
    col.inactive_border = $hyper_inactive
}

group {
    col.border_active = $hyper_active
    col.border_inactive = $hyper_inactive
    col.border_locked_active = $hyper_urgent
}

decoration {
    shadow {
        color = rgba({{shadow}}66)
    }
}
